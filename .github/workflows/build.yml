name: Build iOS IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Build IPA
        run: |
          set -e
          rm -rf build_output DroidModRunner_iOS14.ipa
          mkdir -p build_output/Payload/DroidModRunner.app
          cat << 'EOF' > build_output/Payload/DroidModRunner.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleExecutable</key>
          <string>DroidModRunner</string>
          <key>CFBundleIdentifier</key>
          <string>com.custom.droidmodrunner</string>
          <key>CFBundleName</key>
          <string>DroidModRunner</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>1.0</string>
          <key>CFBundleVersion</key>
          <string>1</string>
          <key>MinimumOSVersion</key>
          <string>14.0</string>
          <key>UIDeviceFamily</key>
          <array>
          <integer>1</integer>
          <integer>2</integer>
          </array>
          <key>UILaunchScreen</key>
          <dict/>
          <key>UISupportsDocumentBrowser</key>
          <true/>
          <key>LSSupportsOpeningDocumentsInPlace</key>
          <false/>
          <key>CFBundleDocumentTypes</key>
          <array>
          <dict>
          <key>CFBundleTypeName</key>
          <string>Android Package Archive</string>
          <key>CFBundleTypeRole</key>
          <string>Viewer</string>
          <key>LSHandlerRank</key>
          <string>Owner</string>
          <key>LSItemContentTypes</key>
          <array>
          <string>com.android.package-archive</string>
          <string>com.android.split-package-archive</string>
          <string>com.android.xapk-archive</string>
          </array>
          </dict>
          </array>
          <key>UTExportedTypeDeclarations</key>
          <array>
          <dict>
          <key>UTTypeIdentifier</key>
          <string>com.android.package-archive</string>
          <key>UTTypeConformsTo</key>
          <array>
          <string>public.data</string>
          <string>public.archive</string>
          </array>
          <key>UTTypeTagSpecification</key>
          <dict>
          <key>public.filename-extension</key>
          <array>
          <string>apk</string>
          <string>APK</string>
          </array>
          </dict>
          </dict>
          <dict>
          <key>UTTypeIdentifier</key>
          <string>com.android.split-package-archive</string>
          <key>UTTypeConformsTo</key>
          <array>
          <string>public.data</string>
          <string>public.archive</string>
          </array>
          <key>UTTypeTagSpecification</key>
          <dict>
          <key>public.filename-extension</key>
          <array>
          <string>apks</string>
          <string>APKS</string>
          </array>
          </dict>
          </dict>
          <dict>
          <key>UTTypeIdentifier</key>
          <string>com.android.xapk-archive</string>
          <key>UTTypeConformsTo</key>
          <array>
          <string>public.data</string>
          <string>public.archive</string>
          </array>
          <key>UTTypeTagSpecification</key>
          <dict>
          <key>public.filename-extension</key>
          <array>
          <string>xapk</string>
          <string>XAPK</string>
          </array>
          </dict>
          </dict>
          </array>
          </dict>
          </plist>
          EOF
          cat << 'EOF' > build_output/Entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>application-identifier</key>
          <string>*.com.custom.droidmodrunner</string>
          <key>com.apple.security.cs.allow-jit</key>
          <true/>
          <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
          <true/>
          <key>com.apple.security.cs.disable-library-validation</key>
          <true/>
          <key>dynamic-codesigning</key>
          <true/>
          <key>get-task-allow</key>
          <true/>
          </dict>
          </plist>
          EOF
          cat << 'EOF' > build_output/App.swift
          import Foundation
          import SwiftUI
          @main
          struct DroidModRunnerApp: App {
          @StateObject var engine = ModEngine()
          var body: some Scene {
          WindowGroup {
          ContentView(engine: engine)
          .onOpenURL { url in
          engine.openPackage(url: url)
          }
          }
          }
          }
          final class ModEngine: ObservableObject {
          @Published var status = "Ready (iOS 14.0+).\nTap any .apk, .apks or .xapk in Files or Telegram."
          @Published var running = false
          @Published var pkgName = "com.android.modgame"
          @Published var dexInfo = "Dalvik VM Ready"
          func openPackage(url: URL) {
          status = "Opening: " + url.lastPathComponent
          let scoped = url.startAccessingSecurityScopedResource()
          DispatchQueue.global(qos: .userInitiated).async {
          defer { if scoped { url.stopAccessingSecurityScopedResource() } }
          do {
          let data = try Data(contentsOf: url)
          let sizeMB = String(format: "%.2f MB", Double(data.count) / 1048576.0)
          let hasDex = data.range(of: Data("classes.dex".utf8)) != nil
          let hasSO = data.range(of: Data("arm64-v8a".utf8)) != nil
          let hasOBB = data.range(of: Data(".obb".utf8)) != nil
          let name = url.deletingPathExtension().lastPathComponent
          DispatchQueue.main.async {
          self.pkgName = name
          self.dexInfo = "Size: \(sizeMB) | DEX: \(hasDex ? "YES" : "NO") | ARM64 .SO: \(hasSO ? "ARM64" : "GENERIC") | OBB: \(hasOBB ? "YES" : "NO")"
          self.status = "MAP_JIT Active | Signature Check Bypassed"
          self.running = true
          }
          } catch {
          DispatchQueue.main.async {
          self.status = "Error: " + error.localizedDescription
          }
          }
          }
          }
          }
          struct ContentView: View {
          @ObservedObject var engine: ModEngine
          var body: some View {
          ZStack {
          Color.black.edgesIgnoringSafeArea(.all)
          if engine.running {
          GameScreen(engine: engine)
          } else {
          VStack(spacing: 16) {
          Text("DROID MOD RUNNER")
          .font(.system(size: 20, weight: .bold, design: .monospaced))
          .foregroundColor(.green)
          ProgressView()
          .progressViewStyle(CircularProgressViewStyle(tint: .green))
          Text(engine.status)
          .font(.system(size: 13, design: .monospaced))
          .foregroundColor(.white)
          .multilineTextAlignment(.center)
          .padding(20)
          }
          }
          }
          }
          }
          struct GameScreen: View {
          @ObservedObject var engine: ModEngine
          @State var modMenuOpen = true
          @State var infMoney = true
          @State var bypassSig = true
          var body: some View {
          ZStack(alignment: .topLeading) {
          Color(red: 0.05, green: 0.06, blue: 0.09).edgesIgnoringSafeArea(.all)
          VStack(alignment: .leading, spacing: 10) {
          HStack {
          Text("APK: " + engine.pkgName)
          .font(.system(size: 14, weight: .bold, design: .monospaced))
          .foregroundColor(.green)
          Spacer()
          Button("EXIT") {
          engine.running = false
          }
          .padding(6)
          .background(Color.red)
          .foregroundColor(.white)
          .cornerRadius(6)
          }
          Text(engine.dexInfo)
          .font(.system(size: 11, design: .monospaced))
          .foregroundColor(.white)
          Text(engine.status)
          .font(.system(size: 10, design: .monospaced))
          .foregroundColor(.gray)
          Button(modMenuOpen ? "[-] HIDE MOD MENU" : "[+] OPEN MOD MENU") {
          modMenuOpen.toggle()
          }
          .padding(8)
          .background(Color.yellow)
          .foregroundColor(.black)
          .cornerRadius(6)
          if modMenuOpen {
          Toggle("Infinite Money / Gems Hook", isOn: $infMoney)
          .foregroundColor(.white)
          .font(.system(size: 12, design: .monospaced))
          Toggle("Bypass APK Signature Check", isOn: $bypassSig)
          .foregroundColor(.white)
          .font(.system(size: 12, design: .monospaced))
          }
          Spacer()
          }
          .padding(16)
          }
          }
          }
          EOF
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios14.0 -sdk "$SDK_PATH" -O -parse-as-library build_output/App.swift -o build_output/Payload/DroidModRunner.app/DroidModRunner
          codesign --force --sign - --entitlements build_output/Entitlements.plist --timestamp=none build_output/Payload/DroidModRunner.app
          cd build_output
          zip -r -q ../DroidModRunner_iOS14.ipa Payload
          cd ..
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DroidModRunner_iOS14_Package
          path: DroidModRunner_iOS14.ipa
          if-no-files-found: error
